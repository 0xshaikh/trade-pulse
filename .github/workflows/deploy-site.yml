name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://0xshaikh.github.io/trade-pulse/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'
      # Deploy-pages can fail transiently (GH Pages 502 / artifact-not-found during
      # outages). The bot pushes every ~64s, so a transient blip used to generate a
      # failure email per run. Retry up to 3 attempts: only if ALL fail does the run
      # (and the notification email) fire. Each attempt re-uses the same artifact.
      - name: Deploy to GitHub Pages (attempt 1 of 3)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy to GitHub Pages (attempt 2 of 3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy to GitHub Pages (attempt 3 of 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
